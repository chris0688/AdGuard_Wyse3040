# Bootmenü des USB-Sticks (ersetzt /boot/grub/grub.cfg der Debian-ISO).
# Gilt für UEFI-Start (Wyse 3040 und praktisch alle PCs ab ca. 2012).
#
# modprobe.blacklist=... verhindert das bekannte Hängen des Wyse 3040 beim
# Ausschalten auch schon während der Installation (auf anderen PCs in der
# Regel ohne Auswirkung; das installierte System bekommt den Fix nur auf dem Wyse).

# Standard ist bewusst "von Festplatte starten": Bleibt der Stick versehentlich
# stecken, wird ein fertig eingerichtetes Gerät nicht erneut gelöscht.
set default=2
set timeout=30

set menu_color_normal=light-gray/black
set menu_color_highlight=black/light-green

menuentry "AdGuard Home - automatisch installieren   (LOESCHT die interne Festplatte!)" {
    linux  /install.amd/vmlinuz auto=true priority=critical file=/cdrom/preseed.cfg locale=de_DE.UTF-8 keymap=de modprobe.blacklist=dw_dmac,dw_dmac_core --- quiet
    initrd /install.amd/initrd.gz
}

menuentry "Debian 13 manuell installieren" {
    linux  /install.amd/vmlinuz modprobe.blacklist=dw_dmac,dw_dmac_core --- quiet
    initrd /install.amd/initrd.gz
}

menuentry "Von interner Festplatte starten (nichts installieren)" {
    exit
}
