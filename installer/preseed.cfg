#### Debian 13 – automatische Installation für AdGuard Home (Dell Wyse 3040 u.a.)
#
# Beantwortet alle Fragen des Debian-Installers. Wird von build-iso.sh in den
# USB-Stick eingebaut und über den Bootmenü-Eintrag "automatisch installieren"
# geladen.
#
# ACHTUNG: Die interne Festplatte/eMMC wird OHNE Rückfrage komplett gelöscht!

### Sprache, Tastatur, Zeitzone
d-i debian-installer/locale string de_DE.UTF-8
d-i keyboard-configuration/xkb-keymap select de
d-i time/zone string Europe/Berlin
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true

### Netzwerk (DHCP; feste IP später mit "sudo adguard-setup")
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string adguard
d-i netcfg/get_domain string lan
d-i netcfg/hostname string adguard
d-i hw-detect/load_firmware boolean true

### Paketquellen
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/services-select multiselect security, updates
d-i apt-setup/disable-cdrom-entries boolean true

### Benutzer
# Kein root-Login; der Benutzer "adguard" bekommt sudo-Rechte.
# Standardpasswort: AdGuardRootPW1 – muss beim ersten Login geändert werden
# (siehe late_command: chage -d 0).
d-i passwd/root-login boolean false
d-i passwd/user-fullname string AdGuard
d-i passwd/username string adguard
d-i passwd/user-password-crypted password $6$wyse3040adguard$78YB7awI0guYJzt3Lydm.io9CmXLkYiFOqMFa8LGEpY0YYEYLc8Mizy8Lysl/rP6jj1J8eHDEonprI67Ny8uC1

### Partitionierung: interne Festplatte, EFI + eine ext4-Partition, kein Swap
### (Swap übernimmt zram im RAM, das schont eMMC/SSD)
#
# Zielfestplatte automatisch wählen: erste interne Platte in der Reihenfolge
# eMMC, NVMe, SATA, virtuell. Übersprungen werden USB-Laufwerke (also auch der
# Installationsstick), Wechseldatenträger und SD-Karten.
# Wird nichts gefunden, fragt der Installer nach.
d-i partman/early_command string                                                \
    for d in /dev/mmcblk0 /dev/mmcblk1 /dev/nvme0n1 /dev/sda /dev/sdb /dev/sdc /dev/vda; do \
        [ -b "$d" ] || continue;                                                \
        n="${d#/dev/}";                                                         \
        readlink -f "/sys/block/$n" | grep -q /usb && continue;                 \
        [ "$(cat /sys/block/$n/removable 2>/dev/null)" = 1 ] && continue;       \
        [ -e "/sys/block/$n/device/type" ] && [ "$(cat /sys/block/$n/device/type)" = SD ] && continue; \
        debconf-set partman-auto/disk "$d";                                     \
        break;                                                                  \
    done
d-i partman-auto/method string regular
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-auto/purge_lvm_from_device boolean true
d-i partman-partitioning/choose_label select gpt
d-i partman-partitioning/default_label string gpt
d-i partman-auto/expert_recipe string                       \
    adguard ::                                               \
        512 512 512 free                                    \
            $iflabel{ gpt }                                 \
            $reusemethod{ }                                 \
            method{ efi }                                   \
            format{ }                                       \
        .                                                   \
        2000 10000 -1 ext4                                  \
            $primary{ } $bootable{ }                        \
            method{ format } format{ }                      \
            use_filesystem{ } filesystem{ ext4 }            \
            mountpoint{ / }                                 \
            options/noatime{ noatime }                      \
        .
d-i partman-auto/choose_recipe select adguard
d-i partman-basicfilesystems/no_swap boolean false
d-i partman-efi/non_efi_system boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

### Pakete: Minimalsystem + SSH, Rest installiert bootstrap.sh
tasksel tasksel/first multiselect ssh-server
d-i pkgsel/include string sudo curl ca-certificates
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

### Bootloader
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/bootdev string default
# Zusätzlich im Standard-EFI-Pfad ablegen – manche BIOS (u.a. Wyse) vergessen sonst
# den Booteintrag
d-i grub-installer/force-efi-extra-removable boolean true

### Abschluss
# - Repo nach /opt/adguard-setup kopieren
# - nur Wyse 3040: Wyse-Fix sofort aktiv machen (sonst hängt evtl. schon der
#   erste Neustart)
# - Ersteinrichtungsdienst aktivieren (läuft beim ersten Start mit Internet)
# - Passwortänderung beim ersten Login erzwingen
d-i preseed/late_command string                                                         \
    cp -r /cdrom/adguard-setup /target/opt/adguard-setup;                                 \
    chmod +x /target/opt/adguard-setup/scripts/*.sh;                                     \
    if grep -qi "wyse.*3040" /sys/class/dmi/id/product_name 2>/dev/null; then            \
        cp /target/opt/adguard-setup/hardware/wyse3040/etc/modprobe.d/wyse-fix.conf /target/etc/modprobe.d/; \
        in-target update-initramfs -u;                                                  \
    fi;                                                                                 \
    cp /target/opt/adguard-setup/installer/adguard-firstboot.service /target/etc/systemd/system/; \
    in-target systemctl enable adguard-firstboot.service;                          \
    in-target chage -d 0 adguard

# Am Ende ausschalten statt neu starten: so kann der USB-Stick abgezogen werden,
# ohne dass die Installation versehentlich von vorn beginnt.
d-i finish-install/reboot_in_progress note
d-i debian-installer/exit/poweroff boolean true
d-i cdrom-detect/eject boolean false
