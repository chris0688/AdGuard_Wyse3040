# Baut die Installations-ISO.
#  - Tag "v*" pushen (z.B. v1.0)  -> ISO wird als GitHub-Release veröffentlicht
#  - "Run workflow" im Actions-Tab -> ISO nur als Download-Artefakt (Test-Build)
name: ISO bauen

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Werkzeuge installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xorriso curl

      - name: ISO bauen
        run: |
          # Projektversion für ISO-Name und Gerät: Tag (z.B. v0.5) bzw. dev-<commit>
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            export VERSION="$GITHUB_REF_NAME"
          else
            export VERSION="dev-${GITHUB_SHA::7}"
          fi
          ./installer/build-iso.sh
          cd build
          ISO="$(ls adguard-wyse3040-*.iso)"
          sha256sum "$ISO" > "$ISO.sha256"
          echo "ISO=$ISO" >> "$GITHUB_ENV"
          echo "DEBIAN_ISO=$(awk '/amd64-netinst\.iso$/ {print $2; exit}' SHA256SUMS)" >> "$GITHUB_ENV"

      - name: Test-Build als Artefakt hochladen
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ISO }}
          path: build/${{ env.ISO }}*
          retention-days: 7

      - name: Release-Text erstellen
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # Abschnitt "## <tag>" aus einer Änderungsliste (bis zum nächsten "## ")
          section() {
            awk -v tag="$GITHUB_REF_NAME" '
              $1 == "##" { show = ($2 == tag); next }
              show' "$1"
          }
          {
            echo "## Changes"
            echo
            section CHANGELOG.md
            echo
            echo "Update existing devices: \`sudo adguard-setup --update\`"
            echo
            echo "## New installation"
            echo
            echo "Installation ISO for AdGuard Home on the Dell Wyse 3040 (and other UEFI PCs)."
            echo "Language and country are chosen in the boot menu."
            echo "Guide: see [README](https://github.com/$GITHUB_REPOSITORY#quick-start)."
            echo
            echo "**Warning:** the entry \"AdGuard Home: install\" erases the internal disk without confirmation."
            echo
            echo "<details><summary>Deutsch</summary>"
            echo
            echo "## Änderungen"
            echo
            section CHANGELOG.de.md
            echo
            echo "Bestehende Geräte aktualisieren: \`sudo adguard-setup --update\`"
            echo
            echo "Installations-ISO für AdGuard Home auf dem Dell Wyse 3040. Sprache und Land"
            echo "werden im Bootmenü gewählt. Anleitung: [README.de.md](https://github.com/$GITHUB_REPOSITORY/blob/main/README.de.md#schnellstart)."
            echo
            echo "**Achtung:** Der Eintrag „AdGuard Home: installieren“ löscht die interne Festplatte ohne Rückfrage."
            echo
            echo "</details>"
            echo
            echo "---"
            echo "Based on the unmodified official Debian netinstall ISO \`$DEBIAN_ISO\`"
            echo "(Debian is free software). Source code of the included Debian packages:"
            echo "https://cdimage.debian.org/cdimage/release/ · https://snapshot.debian.org/"
            echo "AdGuard Home is **not** included. It is downloaded from the official AdGuard"
            echo "servers during installation."
          } > build/release-body.md

      - name: Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/${{ env.ISO }}
            build/${{ env.ISO }}.sha256
          body_path: build/release-body.md
