# Dell Wyse 3040: Der DMA-Treiber dw_dmac (Intel Atom / Cherry Trail) führt dazu,
# dass das Gerät beim Herunterfahren bzw. Neustarten hängen bleibt und sich nicht
# ausschaltet. Der Treiber wird für den Betrieb nicht benötigt und daher gesperrt.
# Nach Änderungen: sudo update-initramfs -u
blacklist dw_dmac
blacklist dw_dmac_core
install dw_dmac /bin/true
install dw_dmac_core /bin/true
