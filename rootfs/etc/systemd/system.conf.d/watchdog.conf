# Hardware-Watchdog: Hängt sich das System komplett auf (keine Reaktion mehr
# für 1 Minute), startet die Hardware das Gerät automatisch neu.
# Ohne Watchdog-Chip passiert einfach nichts.
#
# Prüfen, ob ein Watchdog vorhanden und aktiv ist:  sudo wdctl
[Manager]
RuntimeWatchdogSec=1min
RebootWatchdogSec=5min
