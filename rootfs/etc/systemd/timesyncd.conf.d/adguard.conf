# Uhrzeit von deutschen NTP-Servern holen (pool.ntp.org-Projekt).
# Fällt einer aus, wird automatisch der nächste genommen; sind alle nicht
# erreichbar, greift Debians Pool als Rückfall.
#
# Status prüfen:  timedatectl timesync-status
[Time]
NTP=0.de.pool.ntp.org 1.de.pool.ntp.org 2.de.pool.ntp.org 3.de.pool.ntp.org
FallbackNTP=0.debian.pool.ntp.org 1.debian.pool.ntp.org 2.debian.pool.ntp.org 3.debian.pool.ntp.org
